// traduce las llamadas del visor original a JSON estáticos publicados en GitHub Pages.
const _rrfsFetchNativo = window.fetch.bind(window);
window.fetch = function(input, init){
  const url = (typeof input === 'string') ? input : (input && input.url ? input.url : '');
  if(url.indexOf(SERVER + '/list') === 0 || url.indexOf(SERVER + '/status') === 0){
    return _rrfsFetchNativo('datos/catalog.json?t=' + Date.now(), init);
  }
  if(url.indexOf(SERVER + '/field?') === 0){
    const q = url.split('?')[1] || '';
    const p = new URLSearchParams(q);
    const prod = p.get('product') || 'precip';
    const h = parseInt(p.get('h') || '3', 10);
    const w = parseInt(p.get('window') || '3', 10);
    const file = 'datos/' + prod + '_f' + String(h).padStart(3,'0') + '_w' + String(w).padStart(2,'0') + '.json?t=' + Date.now();
    return _rrfsFetchNativo(file, init);
  }
  return _rrfsFetchNativo(input, init);
};

function valForColor(v){return defs[selectedProduct].abs?Math.abs(v):v}
function alphaFor(v,lat,lon){
 const p=selectedProduct, x=valForColor(v);
 if(p==='precip') return x<1?.24:(x<5?.36:(x<10?.48:(x<20?.58:.68)));
 if(p==='refc') return x<15?.34:(x<25?.46:(x<35?.58:.72));
 if(p==='tmp'){
   // Resalta La Española y mantiene muy tenue el resto del dominio.
   // Caja aproximada de la isla para mejorar el contraste sin alterar datos.
   const onIsland=(lat>=17.35 && lat<=20.15 && lon>=-74.65 && lon<=-68.15);
   if(onIsland){
     if(v>=24 && v<=31) return .34;
     if((v>=21 && v<24) || (v>31 && v<=33)) return .42;
     if((v>=18 && v<21) || (v>33 && v<=35)) return .50;
     if((v>=12 && v<18) || (v>35 && v<=37)) return .58;
     return .64;
   }else{
     if(v>=24 && v<=31) return .025;
     if((v>=21 && v<24) || (v>31 && v<=33)) return .045;
     if((v>=18 && v<21) || (v>33 && v<=35)) return .065;
     return .085;
   }
 }
 if(p==='dpt'){
   // V27: colores de punto de rocío más vivos dentro de RD.
   // La máscara ya elimina mar/Haití/PR, así que podemos usar mayor opacidad.
   if(v<12)return .48;
   if(v<16)return .52;
   if(v<20)return .56;
   if(v<23)return .60;
   if(v<26)return .64;
   if(v<28)return .68;
   return .72;
 }
 if(p==='cape') return x<250?.10:(x<500?.16:(x<1000?.24:(x<2000?.36:.52)));
 if(p==='cin') return x<25?.10:(x<50?.16:(x<100?.24:(x<200?.34:.48)));
 if(p==='hlcy') return x<50?.10:(x<100?.18:(x<150?.26:(x<250?.38:.50)));
 if(p==='gust') return x<20?.06:(x<30?.12:(x<40?.20:(x<50?.30:.44)));
 if(p==='wind') return x<10?.06:(x<20?.12:(x<30?.20:(x<40?.30:.42)));
 if(p==='efhl') return x<50?.10:(x<100?.18:(x<200?.28:(x<300?.40:.52)));
 if(p==='ebwd') return x<10?.10:(x<15?.18:(x<20?.28:(x<25?.40:.52)));
 if(p==='dcape') return x<250?.08:(x<500?.16:(x<750?.26:(x<1000?.38:.52)));

function nearestValue(lat,lon){let best=null,bd=1e9,iy=Math.round(lat/HASH),ix=Math.round(lon/HASH);for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){const a=pointHash.get((iy+dy)+','+(ix+dx))||[];for(const p of a){const d=(p[0]-lat)*(p[0]-lat)+(p[1]-lon)*(p[1]-lon);if(d<bd){bd=d;best=p}}}return best}

}
function nearestSevere(lat,lon){

const SEV_STEP=.028;

function severeCellKey(lat,lon){
 return Math.round(lat/SEV_STEP)+','+Math.round(lon/SEV_STEP);
}

function severeThresholdComponents(points,minCat){
 // IMPORTANT: threshold nesting, SPC-style:
 // moderate includes moderate+high+very-high;
 // high includes high+very-high;
 // very-high includes only very-high.
 const byKey=new Map();
 for(const p of (points||[])){
   if(p[2] < minCat || !insideDR(p[0],p[1]))continue;
   byKey.set(severeCellKey(p[0],p[1]),p);
 }
 if(!byKey.size)return [];
 const seen=new Set(), comps=[];
 const dirs=[[1,0],[-1,0],[0,1],[0,-1]];
 for(const [k,p] of byKey){
   if(seen.has(k))continue;
   const q=[k],g=[]; seen.add(k);
   while(q.length){
     const kk=q.pop(),pp=byKey.get(kk); if(!pp)continue;
     g.push(pp);
     const [iy,ix]=kk.split(',').map(Number);
     for(const [dy,dx] of dirs){
       const nk=(iy+dy)+','+(ix+dx);
       if(byKey.has(nk)&&!seen.has(nk)){seen.add(nk);q.push(nk)}
     }
   }
   comps.push(g);
 }
 return comps;
}

function severeBoundaryLoops(group){
 // Build oriented outer edges from occupied grid cells, then trace closed loops.
 const occupied=new Set(group.map(p=>severeCellKey(p[0],p[1])));
 const edges=[];
 const add=(a,b)=>edges.push([a,b]);
 for(const k of occupied){
   const [iy,ix]=k.split(',').map(Number);
   // corners in integer half-grid coordinates (x2,y2), avoiding floating key errors.
   const L=2*ix-1,R=2*ix+1,B=2*iy-1,T=2*iy+1;
   // clockwise oriented edges around occupied cells
   if(!occupied.has((iy+1)+','+ix)) add([L,T],[R,T]); // north
   if(!occupied.has(iy+','+(ix+1))) add([R,T],[R,B]); // east
   if(!occupied.has((iy-1)+','+ix)) add([R,B],[L,B]); // south
   if(!occupied.has(iy+','+(ix-1))) add([L,B],[L,T]); // west
 }
 const byStart=new Map();
 const kpt=p=>p[0]+','+p[1];
 edges.forEach((e,i)=>{
   const k=kpt(e[0]); if(!byStart.has(k))byStart.set(k,[]);
   byStart.get(k).push(i);
 });
 const used=new Set(), loops=[];
 for(let i=0;i<edges.length;i++){
   if(used.has(i))continue;
   const loop=[edges[i][0]], first=edges[i][0];
   let cur=edges[i][1], ei=i; used.add(ei);
   let guard=0;
   while(guard++<edges.length+10){
     loop.push(cur);
     if(cur[0]===first[0]&&cur[1]===first[1])break;
     const cands=(byStart.get(kpt(cur))||[]).filter(j=>!used.has(j));
     if(!cands.length)break;
     ei=cands[0];used.add(ei);cur=edges[ei][1];
   }
   if(loop.length>=5 && loop[loop.length-1][0]===first[0] && loop[loop.length-1][1]===first[1]){
     loops.push(loop);
   }
 }
 // convert half-grid coordinates to lat/lon
 return loops.map(loop=>loop.map(q=>[q[1]*SEV_STEP/2,q[0]*SEV_STEP/2]));
}

function rdp(points,eps){
 if(points.length<3)return points;
 const a=points[0],b=points[points.length-1];
 let maxd=0,idx=0;
 const vx=b[1]-a[1],vy=b[0]-a[0],den=vx*vx+vy*vy || 1;
 for(let i=1;i<points.length-1;i++){
   const wx=points[i][1]-a[1],wy=points[i][0]-a[0];
   let t=(wx*vx+wy*vy)/den;t=Math.max(0,Math.min(1,t));
   const px=a[1]+t*vx,py=a[0]+t*vy;
   const dx=points[i][1]-px,dy=points[i][0]-py,d=Math.sqrt(dx*dx+dy*dy);
   if(d>maxd){maxd=d;idx=i}
 }
 if(maxd>eps){
   const l=rdp(points.slice(0,idx+1),eps),r=rdp(points.slice(idx),eps);
   return l.slice(0,-1).concat(r);
 }
 return [a,b];
}

function chaikinClosed(points,passes=2){
 let pts=points.slice();
 // remove duplicated closing point
 if(pts.length>1 && pts[0][0]===pts[pts.length-1][0] && pts[0][1]===pts[pts.length-1][1])pts.pop();
 for(let pass=0;pass<passes;pass++){
   const out=[];
   for(let i=0;i<pts.length;i++){
     const a=pts[i],b=pts[(i+1)%pts.length];
     out.push([.75*a[0]+.25*b[0],.75*a[1]+.25*b[1]]);
     out.push([.25*a[0]+.75*b[0],.25*a[1]+.75*b[1]]);
   }
   pts=out;
 }
 if(pts.length)pts.push(pts[0]);
 return pts;
}

function polygonAreaLatLon(loop){
 let a=0;
 for(let i=0;i<loop.length-1;i++)a+=loop[i][1]*loop[i+1][0]-loop[i+1][1]*loop[i][0];
 return Math.abs(a)/2;
}

function severeLabelPoint(loop){
 // centroid approximation; fallback to mean
 let x=0,y=0,a=0;
 for(let i=0;i<loop.length-1;i++){
   const x0=loop[i][1],y0=loop[i][0],x1=loop[i+1][1],y1=loop[i+1][0];
   const f=x0*y1-x1*y0;a+=f;x+=(x0+x1)*f;y+=(y0+y1)*f;
 }
 if(Math.abs(a)>1e-9)return [y/(3*a),x/(3*a)];
 let sy=0,sx=0,n=Math.max(1,loop.length-1);
 for(let i=0;i<n;i++){sy+=loop[i][0];sx+=loop[i][1]}
 return [sy/n,sx/n];
}

function drawSevereSPC(ctx,m,topLeft,points,minCat,color,label,minCells){
 const comps=severeThresholdComponents(points,minCat);
 for(const g of comps){
   if(g.length<minCells)continue;
   const loops=severeBoundaryLoops(g);
   for(let loop of loops){
     if(polygonAreaLatLon(loop)<0.004)continue;
     // simplify first, then smooth for broad SPC-like contours
     loop=rdp(loop,0.018);
     if(loop.length<4)continue;
     if(loop[0]!==loop[loop.length-1])loop=loop.concat([loop[0]]);
     loop=chaikinClosed(loop,2);
     const pts=loop.map(ll=>m.latLngToLayerPoint(ll).subtract(topLeft));
     if(pts.length<4)continue;

     ctx.save();
     ctx.beginPath();
     ctx.moveTo(pts[0].x,pts[0].y);
     for(let i=1;i<pts.length;i++)ctx.lineTo(pts[i].x,pts[i].y);
     ctx.closePath();

     // nearly transparent interior, preserving satellite map.
     ctx.globalAlpha=.10;
     ctx.fillStyle=color;
     ctx.fill();

     ctx.globalAlpha=.96;
     ctx.strokeStyle=color;
     ctx.lineWidth=minCat===4?4.2:(minCat===3?3.5:3.0);
     ctx.lineJoin='round';
     ctx.lineCap='round';
     ctx.stroke();

     // V39: solo polígonos. Se eliminan por completo las etiquetas de texto
     // dentro de las zonas de potencial severo.
     ctx.restore();
   }
 }
}

function pointInRing(lon,lat,ring){
 let inside=false;
 for(let i=0,j=ring.length-1;i<ring.length;j=i++){
   const xi=ring[i][0], yi=ring[i][1], xj=ring[j][0], yj=ring[j][1];
   const hit=((yi>lat)!=(yj>lat)) && (lon < (xj-xi)*(lat-yi)/((yj-yi)||1e-12)+xi);
   if(hit)inside=!inside;
 }
 return inside;
}
function pointInGeom(lon,lat,g){
 if(!g)return false;
 if(g.type==='Polygon'){
   if(!g.coordinates || !g.coordinates.length)return false;
   if(!pointInRing(lon,lat,g.coordinates[0]))return false;
   for(let i=1;i<g.coordinates.length;i++) if(pointInRing(lon,lat,g.coordinates[i])) return false;
   return true;
 }
 if(g.type==='MultiPolygon'){
   for(const poly of g.coordinates){
     if(!poly || !poly.length)continue;
     if(!pointInRing(lon,lat,poly[0]))continue;
     let hole=false;
     for(let i=1;i<poly.length;i++) if(pointInRing(lon,lat,poly[i])){hole=true;break}
     if(!hole)return true;
   }
 }
 return false;
}
function geomBBox(g){
 let minx=Infinity,miny=Infinity,maxx=-Infinity,maxy=-Infinity;
 const scan=(a)=>{
   if(!Array.isArray(a))return;
   if(a.length>=2 && typeof a[0]==='number' && typeof a[1]==='number'){
     const x=a[0],y=a[1]; if(x<minx)minx=x;if(x>maxx)maxx=x;if(y<miny)miny=y;if(y>maxy)maxy=y;
   }else for(const q of a)scan(q);
 };
 scan(g.coordinates);
 return [minx,miny,maxx,maxy];
}
function buildDRIndex(){
 drIndex=drGeoms.map(g=>({g,b:geomBBox(g)}));

}
function insideDR(lat,lon){
 // Grid RRFS is fixed; cache the result so each grid point is classified only once.
 const key=lat.toFixed(4)+','+lon.toFixed(4);
 if(drMaskCache.has(key))return drMaskCache.get(key);

 for(const it of drIndex){
   const b=it.b;
   if(lon<b[0]||lon>b[2]||lat<b[1]||lat>b[3])continue;
   if(pointInGeom(lon,lat,it.g)){ok=true;break;}
 }

 return ok;
}

function seaPrecipValue(lat,lon){
  if(selectedProduct!=='precip')return null;

  // Dentro de RD manda exclusivamente la etiqueta municipal existente.
  if(lat>=17.45&&lat<=20.05&&lon>=-72.05&&lon<=-68.20&&insideDR(lat,lon))return null;

  // V41.7: usar la misma cuadrícula que ya carga el visor mediante buildHash().
  // La V41.6 intentaba consultar una variable "points" que no existe globalmente.
  const p=nearestValue(lat,lon);
  if(!p||p.length<3)return null;

  const plat=+p[0],plon=+p[1],pv=+p[2];
  if(!isFinite(plat)||!isFinite(plon)||!isFinite(pv))return null;

  // Mostrar el valor solo cuando el cursor está realmente sobre/cerca
  // de una celda RRFS de precipitación, evitando saltar a ecos lejanos.
  const cos=Math.cos(lat*Math.PI/180);
  const dy=plat-lat,dx=(plon-lon)*cos,d2=dx*dx+dy*dy;
  if(d2>(0.040*0.040))return null;

  const val=valForColor(pv);
  if(!isFinite(val)||val<1.0)return null;
  return val;
}

map.on('mousemove',function(e){
  if(selectedProduct!=='precip'){hideSeaPrecipTip();return}
  const v=seaPrecipValue(e.latlng.lat,e.latlng.lng);
  if(v===null){hideSeaPrecipTip();return}
  seaPrecipTip.textContent=(Math.round(v*10)/10).toFixed(1)+' mm';
  seaPrecipTip.style.left=(e.containerPoint.x+14)+'px';
  seaPrecipTip.style.top=(e.containerPoint.y+14)+'px';
  seaPrecipTip.style.display='block';
});

  // Evita que se pinte el rectángulo completo durante la carga inicial.
  if(!drGeoms.length) return;
  for(const a of (selectedProduct==='severo'?[]:this.p)){const xval=valForColor(a[2]);if(xval<d.min)continue;const lat=a[0],lon=a[1],v=a[2];if(!productPointVisible(lat,lon))continue;const pNW=m.latLngToLayerPoint([lat+halfLat,lon-halfLon]).subtract(topLeft),pSE=m.latLngToLayerPoint([lat-halfLat,lon+halfLon]).subtract(topLeft);let x=Math.min(pNW.x,pSE.x)-.55,y=Math.min(pNW.y,pSE.y)-.55,w=Math.abs(pSE.x-pNW.x)+1.1,h=Math.abs(pSE.y-pNW.y)+1.1;if(x+w<-4||y+h<-4||x>size.x+4||y>size.y+4)continue;if(selectedProduct==='inest'){
       // V30: INEST se presenta como zonas categóricas continuas de CAPE,
       // similares a un mapa de áreas de inestabilidad. No se dibuja la
       // cuadrícula de cada celda; las celdas vecinas de la misma categoría
       // se unen visualmente formando áreas amplias.
       const c=inestClass(v);
       ctx.globalAlpha=.46;
       ctx.fillStyle=c.color;
       ctx.fillRect(x-.35,y-.35,w+.70,h+.70);
     }else{
       ctx.globalAlpha=alphaFor(v,lat,lon);
       ctx.fillStyle=color(v);
       ctx.fillRect(x,y,w,h)
     }}
   // V32: alerta combinada. Solo se pinta donde COINCIDEN:
   // precipitación >= 1 mm en el acumulado seleccionado y CAPE >= 3500 J/kg
   // en la misma hora final del pronóstico.
   if(selectedProduct==='precip' && this.alertPoints && this.alertPoints.length){
     for(const a of this.alertPoints){
       const lat=a[0],lon=a[1];
       if(lat<17.45||lat>20.05||lon<-72.05||lon>-68.20)continue;
       if(!insideDR(lat,lon))continue;
       const pNW=m.latLngToLayerPoint([lat+halfLat,lon-halfLon]).subtract(topLeft),
             pSE=m.latLngToLayerPoint([lat-halfLat,lon+halfLon]).subtract(topLeft);
       let x=Math.min(pNW.x,pSE.x)-.55,y=Math.min(pNW.y,pSE.y)-.55,
           w=Math.abs(pSE.x-pNW.x)+1.1,h=Math.abs(pSE.y-pNW.y)+1.1;
       if(x+w<-4||y+h<-4||x>size.x+4||y>size.y+4)continue;
       ctx.globalAlpha=.66;
       ctx.fillStyle='#8b4513';
       ctx.fillRect(x-.35,y-.35,w+.70,h+.70);
       ctx.globalAlpha=.95;
       ctx.strokeStyle='#4a1608';
       ctx.lineWidth=1.15;
       ctx.strokeRect(x-.1,y-.1,w+.2,h+.2);
     }
   }
   // V38: contornos amplios, suavizados y anidados estilo SPC.
   // El umbral Moderado incluye Alto/Muy Alto; Alto incluye Muy Alto.
   // Así las categorías superiores quedan diferenciadas dentro de áreas mayores.
   if(selectedProduct==='severo' && this.severePoints && this.severePoints.length){
     drawSevereSPC(ctx,m,topLeft,this.severePoints,2,'#ff941f','POTENCIAL MODERADO',16);
     drawSevereSPC(ctx,m,topLeft,this.severePoints,3,'#e53935','POTENCIAL ALTO',5);
     drawSevereSPC(ctx,m,topLeft,this.severePoints,4,'#b52fc9','POTENCIAL MUY ALTO',2);
   }
 }
});
const layer=new C().addTo(map);

function cleanLevel(s){
 if(!s)return '';
 return String(s)
   .replace(/\s+above ground\b/gi,'')
   .replace(/\babove ground\b/gi,'')
   .replace(/\s{2,}/g,' ')
   .trim();
}
function fmtUTC(s){if(!s||s.length<10)return'No disponible';const d=new Date(Date.UTC(+s.slice(0,4),+s.slice(4,6)-1,+s.slice(6,8),+s.slice(8,10)));return d.toLocaleString('es-DO',{timeZone:'UTC',day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit',hour12:false})+' UTC'}
function validUTC(s,h){if(!s||s.length<10)return'No disponible';const d=new Date(Date.UTC(+s.slice(0,4),+s.slice(4,6)-1,+s.slice(6,8),+s.slice(8,10)));d.setUTCHours(d.getUTCHours()+h);return d.toLocaleString('es-DO',{timeZone:'UTC',day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit',hour12:false})+' UTC'}
function rebuildHours(){const box=document.getElementById('forecast');box.querySelectorAll('button').forEach(x=>x.remove());hourButtons.clear();const hs=productHours();for(const h of hs){const bt=document.createElement('button');bt.textContent='+'+h+' h';bt.onclick=()=>{selectedHour=h;syncButtons();load()};box.appendChild(bt);hourButtons.set(h,bt)}if(!hs.includes(selectedHour))selectedHour=hs[0]||1}
function syncButtons(){productButtons.forEach((b,p)=>b.classList.toggle('active',p===selectedProduct));windowButtons.forEach((b,w)=>b.classList.toggle('active',w===selectedWindow));hourButtons.forEach((b,h)=>{b.classList.toggle('active',h===selectedHour);b.disabled=selectedProduct==='precip'&&h<selectedWindow});document.getElementById('accum').style.display=selectedProduct==='precip'?'block':'none';document.getElementById('status').style.bottom=selectedProduct==='precip'?'198px':'150px';document.getElementById('products').style.bottom=selectedProduct==='precip'?'105px':'61px'}
async function load(){
 syncButtons();updateLegend();
 const st=document.getElementById('status'),ddef=defs[selectedProduct];
 st.textContent='Cargando '+ddef.name+' +'+selectedHour+' h...';
 try{
   if(selectedProduct==='severo'){
     const get=async(p,w=3)=>await(await fetch(SERVER+'/field?product='+p+'&h='+selectedHour+'&window='+w+'&nocache='+Date.now(),{cache:'no-store'})).json();
     // V41.7.9: SEVERO ampliado. Mantiene los 6 ingredientes base y suma
     // SCP, MXUPHL 2–5 km, MXUPHL 0–3 km, EFHL, EBWD y DCAPE cuando el servidor los ofrece.
     // Los campos avanzados son opcionales para no inutilizar SEVERO si uno falta en una corrida.
     const getOpt=async(p)=>{try{const x=await get(p);return (x&&x.ok)?x:null}catch(e){return null}};
     const [pr,ca,ci,he,refl,gu,scp,mx25,mx03,ef,eb,dc]=await Promise.all([
       get('precip',3),get('cape'),get('cin'),get('hlcy'),get('refc'),get('gust'),
       getOpt('scp'),getOpt('mxuphl25'),getOpt('mxuphl03'),getOpt('efhl'),getOpt('ebwd'),getOpt('dcape')
     ]);
     const baseSets=[pr,ca,ci,he,refl,gu];
     if(baseSets.some(x=>!x.ok)){st.textContent='No están disponibles todos los ingredientes base para SEVERO +'+selectedHour+' h';layer.setSeverePoints([]);return}
     const mk=(pts)=>{const m=new Map();for(const p of pts||[])m.set(p[0].toFixed(4)+','+p[1].toFixed(4),p[2]);return m};
     const mp=mk(pr.points),mi=mk(ci.points),mh=mk(he.points),mr=mk(refl.points),mg=mk(gu.points);
     const ms=mk(scp&&scp.points),m25=mk(mx25&&mx25.points),m03=mk(mx03&&mx03.points),mef=mk(ef&&ef.points),meb=mk(eb&&eb.points),mdc=mk(dc&&dc.points);
     const advancedAvailable=[scp,mx25,mx03,ef,eb,dc].filter(Boolean).length;
     const out=[];
     for(const p of (ca.points||[])){
       const k=p[0].toFixed(4)+','+p[1].toFixed(4),cape=p[2],rain=mp.get(k)||0,cin=Math.abs(mi.get(k)||0),hl=mh.get(k)||0,rf=mr.get(k)||0,gust=mg.get(k)||0;
       const scpv=ms.get(k)||0,mx25v=m25.get(k)||0,mx03v=m03.get(k)||0,efv=mef.get(k)||0,ebv=meb.get(k)||0,dcv=mdc.get(k)||0;

       // Señal dinámica avanzada: permite conservar una célula potencialmente importante
       // aunque el RRFS desplace ligeramente la lluvia/reflectividad respecto de la observación.
       const advancedSignal=(scpv>=1 || mx25v>=75 || mx03v>=75 || efv>=100 || ebv>=15 || dcv>=750);
       if(cape<300)continue;
       if(cape<500 && !advancedSignal)continue;
       if(rain<1 && rf<20 && !advancedSignal)continue;

       let baseScore=0;
       if(rain>=1)baseScore++; if(rain>=10)baseScore++;
       if(cape>=1000)baseScore++; if(cape>=2500)baseScore++; if(cape>=3500)baseScore++;
       if(cin<=100)baseScore++; if(cin<=50)baseScore++;
       if(hl>=100)baseScore++; if(hl>=200)baseScore++;
       if(rf>=35)baseScore++; if(rf>=45)baseScore++;
       if(gust>=40)baseScore++; if(gust>=60)baseScore++;

       let advancedScore=0;
       if(scpv>=1)advancedScore++; if(scpv>=4)advancedScore++;
       if(mx25v>=75)advancedScore++; if(mx25v>=150)advancedScore++;
       if(mx03v>=75)advancedScore++; if(mx03v>=150)advancedScore++;
       if(efv>=100)advancedScore++; if(efv>=200)advancedScore++;
       if(ebv>=15)advancedScore++; if(ebv>=20)advancedScore++;
       if(dcv>=750)advancedScore++; if(dcv>=1000)advancedScore++;
       // Limita el refuerzo para que un solo grupo de parámetros no domine el diagnóstico.
       advancedScore=Math.min(advancedScore,5);
       const score=baseScore+advancedScore;
       let cat=score>=11?4:score>=7?3:score>=4?2:1;
       out.push([p[0],p[1],cat,rain,cape,cin,hl,rf,gust,scpv,mx25v,mx03v,efv,ebv,dcv,baseScore,advancedScore]);
     }
     currentMeta=ca;buildSevereHash(out);layer.setPoints([]);layer.setAlertPoints([]);layer.setSeverePoints(out);
     const n=[0,0,0,0,0];for(const q of out)n[q[2]]++;
     st.textContent='SEVERO ampliado · Pronóstico +'+selectedHour+' h · Moderado '+n[2].toLocaleString()+' · Alto '+n[3].toLocaleString()+' · Muy alto '+n[4].toLocaleString()+' · Avanzados '+advancedAvailable+'/6 · Válido: '+(ca.valid?fmtUTC(ca.valid):validUTC(ca.run,selectedHour));
     // V34: se elimina el cuadro marrón superior derecho para el producto Severo.
     if(municipios)municipios.bringToFront();return;
   }

   layer.setSeverePoints([]);buildSevereHash([]);
   const d=await(await fetch(SERVER+'/field?product='+dataProduct()+'&h='+selectedHour+'&window='+selectedWindow+'&nocache='+Date.now(),{cache:'no-store'})).json();
   if(!d.ok){st.textContent=d.error||'No disponible';return}
   currentMeta=d;buildHash(d.points||[]);layer.setPoints(d.points||[]);
   let alertCount=0;
   if(selectedProduct==='precip'){
     try{
       const cape=await(await fetch(SERVER+'/field?product=cape&h='+selectedHour+'&window=3&nocache='+Date.now(),{cache:'no-store'})).json();
       const capeMap=new Map();
       if(cape.ok)for(const q of (cape.points||[]))if(q[2]>=3500)capeMap.set(q[0].toFixed(4)+','+q[1].toFixed(4),q[2]);
       const alerts=[];
       for(const p of (d.points||[])){if(p[2]<1)continue;const cv=capeMap.get(p[0].toFixed(4)+','+p[1].toFixed(4));if(cv!=null)alerts.push([p[0],p[1],p[2],cv])}
       alertCount=alerts.length;layer.setAlertPoints(alerts);
     }catch(e){layer.setAlertPoints([])}
   }else layer.setAlertPoints([]);
   let txt=ddef.name+' · Pronóstico +'+selectedHour+' h';
   if(selectedProduct==='precip'){txt=(selectedWindow===1?'Lluvia 1 h':'Acumulado '+selectedWindow+' h')+' para pronóstico +'+selectedHour+' h · Periodo '+d.start_hour+'-'+d.end_hour+' h';txt+=alertCount>0?' · ALERTA lluvia + inestabilidad extrema':' · Sin coincidencia lluvia + CAPE extremo'}
   if(selectedProduct==='inest')txt='Inestabilidad CAPE · Pronóstico +'+selectedHour+' h';
   txt+=' · Corrida: '+fmtUTC(d.run)+' · Válido: '+(d.valid?fmtUTC(d.valid):validUTC(d.run,selectedHour));
   if(d.level && !['refc','inest'].includes(selectedProduct)){const cl=cleanLevel(d.level);if(cl)txt+=' · '+cl}
   st.textContent=txt;if(municipios)municipios.bringToFront()
 }catch(e){st.textContent='Error: '+e}
}
async function init(){try{catalog=await(await fetch(SERVER+'/list?nocache='+Date.now(),{cache:'no-store'})).json();currentDataVersion=catalog.data_version||null;currentRun=catalog.run||null;const pb=document.getElementById('products'),ab=document.getElementById('accum');
 for(const p of Object.keys(catalog.products)){if(!defs[p])continue;const bt=document.createElement('button');bt.textContent=defs[p].name;bt.onclick=()=>{selectedProduct=p;rebuildHours();syncButtons();load();if(panelAyuda.classList.contains('visible'))actualizarAyuda()};pb.appendChild(bt);productButtons.set(p,bt)}
 if(catalog.products.cape){const bt=document.createElement('button');bt.textContent='Inest';bt.onclick=()=>{selectedProduct='inest';rebuildHours();syncButtons();load();if(panelAyuda.classList.contains('visible'))actualizarAyuda()};pb.appendChild(bt);productButtons.set('inest',bt)}
 if(catalog.products.cape&&catalog.products.precip&&catalog.products.cin&&catalog.products.hlcy&&catalog.products.refc&&catalog.products.gust){const bt=document.createElement('button');bt.textContent='Severo';bt.onclick=()=>{selectedProduct='severo';rebuildHours();syncButtons();load();if(panelAyuda.classList.contains('visible'))actualizarAyuda()};pb.appendChild(bt);productButtons.set('severo',bt)}
 for(const w of catalog.windows){const bt=document.createElement('button');bt.textContent=(w===1?'LLUVIA 1 H':'ACUM. '+w+' H');bt.title=(w===1?'Precipitación pronosticada durante una hora':'Lluvia acumulada durante las últimas '+w+' horas del periodo seleccionado');bt.onclick=()=>{selectedWindow=w;if(selectedHour<w){const hs=catalog.products.precip?catalog.products.precip.hours:[];const ok=hs.filter(h=>h>=w);if(ok.length)selectedHour=ok[0]}syncButtons();load()};ab.appendChild(bt);windowButtons.set(w,bt)}
 if(!catalog.products[selectedProduct])selectedProduct=Object.keys(catalog.products)[0];
 if(selectedProduct==='precip'){
   selectedWindow=3; // ACUM. 3 H obligatorio al iniciar precipitación
   const ph=(catalog.products.precip&&catalog.products.precip.hours)||[];
   if(ph.includes(3))selectedHour=3;
   else if(ph.length)selectedHour=ph[0];
 }
 rebuildHours();syncButtons();load()
}catch(e){document.getElementById('status').textContent='Ejecute INICIAR_RRFS_VISOR_MULTIVARIABLE_V41.cmd'}}
async function checkForNewRun(){
 try{
   const j=await(await fetch(SERVER+'/list?nocache='+Date.now(),{cache:'no-store'})).json();
   if(!j||!j.ok)return;
   const changed=(currentDataVersion!==null && j.data_version && j.data_version!==currentDataVersion);
   const runChanged=(currentRun && j.run && j.run!==currentRun);
   if(changed||runChanged){
     const oldRun=currentRun;
     catalog=j;currentDataVersion=j.data_version||currentDataVersion;currentRun=j.run||currentRun;
     rebuildHours();syncButtons();
     // El servidor ya invalidó su CACHE; esta carga toma directamente la corrida nueva.
     await load();
     if(oldRun&&currentRun&&oldRun!==currentRun){
       const st=document.getElementById('status');
       st.textContent+=' · Actualizado automáticamente desde '+fmtUTC(oldRun)+' a '+fmtUTC(currentRun);
     }
   }else{
     currentDataVersion=j.data_version||currentDataVersion;currentRun=j.run||currentRun;
   }
 }catch(e){}
}
init().then(()=>{setInterval(checkForNewRun,20000)});
