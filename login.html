<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Acceso SATMA</title>
<style>
html,body{height:100%;margin:0;font-family:Segoe UI,Tahoma,Arial,sans-serif;background:#020817;color:#fff}
body{display:grid;place-items:center;padding:18px;box-sizing:border-box}
.card{width:min(380px,94vw);background:#111827;border:1px solid #374151;border-radius:14px;padding:22px;box-shadow:0 18px 48px rgba(0,0,0,.55)}
h1{font-size:1.15rem;text-align:center;margin:0 0 6px}.sub{text-align:center;color:#9ca3af;font-size:.8rem;margin:0 0 18px}
label{display:block;font-size:.78rem;color:#d1d5db;margin:10px 0 5px}input{width:100%;box-sizing:border-box;border:1px solid #4b5563;background:#0b1220;color:#fff;border-radius:8px;padding:11px 12px;font-size:.95rem;outline:none}input:focus{border-color:#ef4444}
button{width:100%;margin-top:16px;border:0;border-radius:8px;background:#d7191c;color:#fff;padding:11px 12px;font-weight:800;cursor:pointer;font-size:.92rem}button:disabled{opacity:.6;cursor:wait}.err{min-height:20px;text-align:center;color:#fca5a5;font-size:.78rem;margin-top:10px}.note{text-align:center;color:#6b7280;font-size:.68rem;margin-top:14px;line-height:1.4}
</style>
</head>
<body>
<main class="card">
<h1>Acceso al Visor SATMA</h1>
<p class="sub">Sistema de Alerta Temprana Multi-Amenaza</p>
<form id="login-form" autocomplete="on">
<label for="usuario">Usuario</label>
<input id="usuario" name="username" autocomplete="username" required autofocus>
<label for="clave">Contraseña</label>
<input id="clave" name="password" type="password" autocomplete="current-password" required>
<button id="btn" type="submit">Ingresar</button>
<div id="err" class="err" aria-live="polite"></div>
</form>
<p class="note">La validación se realiza en el servidor. Esta página no contiene la lista de usuarios ni contraseñas.</p>
</main>
<script>
const form=document.getElementById('login-form'),btn=document.getElementById('btn'),err=document.getElementById('err');
form.addEventListener('submit',async(e)=>{e.preventDefault();err.textContent='';btn.disabled=true;btn.textContent='Verificando…';
try{const r=await fetch('/api/login',{method:'POST',credentials:'same-origin',cache:'no-store',headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify({username:document.getElementById('usuario').value.trim(),password:document.getElementById('clave').value})});
const d=await r.json().catch(()=>({}));if(!r.ok){err.textContent=d.error||'Usuario o contraseña incorrectos.';return;}location.replace('/');}
catch(_){err.textContent='No se pudo conectar con el servidor.';}finally{btn.disabled=false;btn.textContent='Ingresar';}});
</script>
</body></html>
